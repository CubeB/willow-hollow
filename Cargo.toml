[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Grid code indexes several parallel arrays with one loop variable; rewriting those
# loops as iterator chains makes them harder to read, not easier.
[workspace.lints.clippy]
needless_range_loop = "allow"

# Worldgen and meshing are far too slow unoptimised, so even dev builds optimise.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

# For day-to-day work: release optimisation, but incremental and without link-time
# optimisation, so a change to the game crate rebuilds in seconds instead of a minute.
# Frames cost the same (the GPU sets the pace); world generation is about 1.5% slower.
# Bench and ship with --release.
[profile.fast]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
